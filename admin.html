<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crispy Shop Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #0a0a0a;
      border: 1px solid #FFD400;
      border-radius: 18px;
      padding: 30px 25px;
      box-shadow: 0 0 30px rgba(255, 212, 0, 0.2);
    }

    h1 {
      text-align: center;
      color: #FFD400;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 9px;
      border: 1px solid #FFD400;
      background: #111;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #FFD400;
      color: #0a0a0a;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #ff7777;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>🔐 Admin Login</h1>

    <input
      type="email"
      id="email"
      placeholder="Admin email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="login()">Login</button>

    <div id="message"></div>
  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


    // USE THE SAME FIREBASE CONFIG
    // FROM YOUR EXISTING index.html

    const firebaseConfig = {
      apiKey: "PASTE_YOUR_EXISTING_API_KEY",
      authDomain: "PASTE_YOUR_EXISTING_AUTH_DOMAIN",
      projectId: "PASTE_YOUR_EXISTING_PROJECT_ID",
      storageBucket: "PASTE_YOUR_EXISTING_STORAGE_BUCKET",
      messagingSenderId: "PASTE_YOUR_EXISTING_MESSAGING_SENDER_ID",
      appId: "PASTE_YOUR_EXISTING_APP_ID"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    window.login = async function () {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("message");

      if (!email || !password) {
        message.textContent = "Enter your email and password.";
        return;
      }

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        message.style.color = "#55ff88";
        message.textContent = "Login successful.";

        // We'll connect this to your admin panel next.

      } catch (error) {

        message.style.color = "#ff7777";
        message.textContent =
          "Login failed. Check your email and password.";

      }
    };

  </script>

</body>
</html>
