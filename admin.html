<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRISPY SHOP — Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#050708;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

header{
  border-bottom:1px solid #00d9d0;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#050708;
}

.logo{
  width:140px;
  max-height:65px;
  object-fit:contain;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.admin-label{
  color:#00e5d5;
  font-size:13px;
  font-weight:bold;
}

button{
  cursor:pointer;
  font-weight:bold;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.logout{
  background:transparent;
  border:1px solid #ffd400;
  color:#ffd400;
  padding:10px 15px;
}

main{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:25px 15px 50px;
}

.login-box,
.admin-panel{
  width:100%;
  max-width:500px;
  margin:50px auto;
  background:#080d0f;
  border:1px solid #00d9d0;
  padding:25px;
}

.admin-panel{
  max-width:1100px;
  margin:0 auto;
}

h1{
  color:#ffd400;
  text-align:center;
  margin-bottom:8px;
}

.subtitle{
  color:#999;
  text-align:center;
  font-size:13px;
  margin-bottom:25px;
}

.logo-large{
  display:block;
  width:170px;
  max-height:100px;
  object-fit:contain;
  margin:0 auto 20px;
}

label{
  display:block;
  color:#00e5d5;
  font-size:13px;
  font-weight:bold;
  margin:15px 0 7px;
}

input,
select,
textarea{
  width:100%;
  background:#050708;
  border:1px solid #294448;
  color:#fff;
  padding:13px;
  outline:none;
  border-radius:3px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#00e5d5;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.primary{
  width:100%;
  margin-top:20px;
  padding:13px;
  background:#ffd400;
  color:#050708;
  border:1px solid #ffd400;
}

.secondary{
  padding:11px 16px;
  background:transparent;
  color:#00e5d5;
  border:1px solid #00d9d0;
}

.danger{
  padding:10px 14px;
  background:transparent;
  color:#ff5555;
  border:1px solid #ff5555;
}

.message{
  margin-top:15px;
  padding:12px;
  display:none;
  font-size:13px;
}

.success{
  display:block;
  color:#21d86b;
  border:1px solid #21d86b;
}

.error{
  display:block;
  color:#ff5555;
  border:1px solid #ff5555;
}

#adminArea{
  display:none;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.topbar h2{
  color:#ffd400;
}

.status{
  color:#00e5d5;
  font-size:13px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.full{
  grid-column:1/-1;
}

.form-box{
  border:1px solid #00aaa5;
  background:#070b0d;
  padding:20px;
  margin-bottom:25px;
}

.form-box h3{
  color:#00e5d5;
  margin-bottom:10px;
}

/* PHOTO UPLOAD */

.photo-box{
  border:1px dashed #00e5d5;
  background:#05090a;
  padding:18px;
  text-align:center;
  margin-bottom:5px;
}

.photo-box:hover{
  border-color:#ffd400;
}

.photo-label{
  display:block;
  color:#ffd400;
  font-size:15px;
  font-weight:bold;
  margin:0 0 12px;
}

.photo-input{
  width:100%;
  padding:12px;
  background:#020405;
  border:1px solid #00d9d0;
  color:#fff;
}

.photo-help{
  color:#888;
  font-size:12px;
  margin-top:9px;
}

.photo-preview{
  display:none;
  width:100%;
  max-width:360px;
  height:220px;
  object-fit:cover;
  margin:15px auto 0;
  border:2px solid #ffd400;
  background:#000;
}

.remove-photo{
  display:none;
  margin:10px auto 0;
  padding:9px 14px;
  background:transparent;
  border:1px solid #ff5555;
  color:#ff5555;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.accounts{
  display:grid;
  gap:12px;
}

.account{
  border:1px solid #21494b;
  background:
    linear-gradient(
      rgba(0,217,208,.05) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(0,217,208,.05) 1px,
      transparent 1px
    ),
    #070b0d;
  background-size:25px 25px;
  padding:16px;
}

.account-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.account h3{
  color:#fff;
}

.account-photo{
  width:100%;
  max-width:320px;
  height:190px;
  object-fit:cover;
  display:block;
  margin:14px 0;
  border:1px solid #00d9d0;
  background:#000;
}

.account-meta{
  color:#00e5d5;
  font-size:13px;
  margin-top:8px;
}

.account-description{
  color:#999;
  font-size:13px;
  margin-top:8px;
}

.account-price{
  color:#ffd400;
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}

.account-status{
  display:inline-block;
  padding:5px 8px;
  background:#ffd400;
  color:#050708;
  font-size:10px;
  font-weight:bold;
}

.account-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.hidden{
  display:none!important;
}

.uploading{
  color:#ffd400;
  font-size:13px;
  margin-top:10px;
  display:none;
}

@media(max-width:650px){

  header{
    flex-direction:column;
    gap:12px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .account-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .admin-panel{
    padding:15px;
  }

  .actions{
    flex-direction:column;
  }

  .actions button{
    width:100%!important;
  }
}
</style>
</head>

<body>

<header>

<img
  src="logo.png.jpeg"
  class="logo"
  alt="CRISPY SHOP"
>

<div class="header-right">

<span
  id="adminEmail"
  class="admin-label"
></span>

<button
  id="logoutBtn"
  class="logout hidden"
>
LOG OUT
</button>

</div>

</header>


<main>


<!-- LOGIN -->

<section
  id="loginArea"
  class="login-box"
>

<img
  src="logo.png.jpeg"
  class="logo-large"
  alt="CRISPY SHOP"
>

<h1>ADMIN PANEL</h1>

<p class="subtitle">
Authorized administrators only
</p>

<label for="email">
ADMIN EMAIL

<input
  id="email"
  type="email"

<!-- ADMIN AREA -->

<section
  id="adminArea"
  class="admin-panel"
>

<div class="topbar">

<h2>
⚙ CRISPY SHOP ADMIN

● SECURE ADMIN SESSION
</div>

<!-- ADD / EDIT -->

📷 UPLOAD ACCOUNT PHOTO

<!-- FIREBASE -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL,
  deleteObject
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
    "AIzaSyC9FNL08mvrtbcjXXj_JBWPHvdUORioYr8",

  authDomain:
    "crispy-shop-25644.firebaseapp.com",

  projectId:
    "crispy-shop-25644",

  storageBucket:
    "crispy-shop-25644.firebasestorage.app",

  messagingSenderId:
    "311251480323",

  appId:
    "1:311251480323:web:b0d9e14c947a0528ccc336"

};


/* ADMIN EMAIL */

const ADMIN_EMAIL =
  "crispyshop11@gmail.com";


/* INITIALIZE */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

const storage =
  getStorage(app);


/* ELEMENTS */

const loginArea =
  document.getElementById("loginArea");

const adminArea =
  document.getElementById("adminArea");

const loginBtn =
  document.getElementById("loginBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const loginMessage =
  document.getElementById("loginMessage");

const formMessage =
  document.getElementById("formMessage");

const adminEmail =
  document.getElementById("adminEmail");

const accountsList =
  document.getElementById("accountsList");

const saveBtn =
  document.getElementById("saveBtn");

const cancelEditBtn =
  document.getElementById("cancelEditBtn");

const refreshBtn =
  document.getElementById("refreshBtn");

const accountPhoto =
  document.getElementById("accountPhoto");

const photoPreview =
  document.getElementById("photoPreview");

const removePhotoBtn =
  document.getElementById("removePhotoBtn");

const uploadingMessage =
  document.getElementById("uploadingMessage");


let editingId = null;

let oldPhotoPath = "";

let selectedPhotoFile = null;

let selectedPhotoData = "";


/* MESSAGE */

function showMessage(
  element,
  text,
  type
){

  element.textContent =
    text;

  element.className =
    "message " + type;

}


/* PHOTO PREVIEW */

accountPhoto.addEventListener(
  "change",
  function(){

    const file =
      accountPhoto.files[0];

    if(!file){

      selectedPhotoFile = null;

      return;
    }


    if(
      !file.type.startsWith("image/")
    ){

      showMessage(
        formMessage,
        "Please choose an image file.",
        "error"
      );

      accountPhoto.value = "";

      return;
    }


    if(
      file.size > 10 * 1024 * 1024
    ){

      showMessage(
        formMessage,
        "Photo must be smaller than 10MB.",
        "error"
      );

      accountPhoto.value = "";

      return;
    }


    selectedPhotoFile =
      file;


    const reader =
      new FileReader();


    reader.onload =
      function(event){

        selectedPhotoData =
          event.target.result;

        photoPreview.src =
          selectedPhotoData;

        photoPreview.style.display =
          "block";

        removePhotoBtn.style.display =
          "block";

      };


    reader.readAsDataURL(file);

  }
);


/* REMOVE PHOTO */

removePhotoBtn.addEventListener(
  "click",
  function(){

    accountPhoto.value = "";

    selectedPhotoFile = null;

    selectedPhotoData = "";

    photoPreview.src = "";

    photoPreview.style.display =
      "none";

    removePhotoBtn.style.display =
      "none";

  }
);


/* LOGIN */

loginBtn.addEventListener(
  "click",
  async function(){

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    if(!email || !password){

      showMessage(
        loginMessage,
        "Enter your admin email and password.",
        "error"
      );

      return;
    }


    loginBtn.disabled = true;

    loginBtn.textContent =
      "LOGGING IN...";


    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }catch(error){

      console.error(error);

      showMessage(
        loginMessage,
        "Login failed. Check your email and password.",
        "error"
      );

      loginBtn.disabled = false;

      loginBtn.textContent =
        "SECURE LOGIN";

    }

  }
);


/* AUTH STATE */

onAuthStateChanged(
  auth,
  async function(user){

    if(!user){

      loginArea.style.display =
        "block";

      adminArea.style.display =
        "none";

      logoutBtn.classList.add(
        "hidden"
      );

      adminEmail.textContent =
        "";

      return;

    }


    if(
      user.email !==
      ADMIN_EMAIL
    ){

      await signOut(auth);

      showMessage(
        loginMessage,
        "This account is not authorized to access the admin panel.",
        "error"
      );

      return;

    }


    loginArea.style.display =
      "none";

    adminArea.style.display =
      "block";

    logoutBtn.classList.remove(
      "hidden"
    );

    adminEmail.textContent =
      user.email || "";


    await loadAccounts();

  }
);


/* LOGOUT */

logoutBtn.addEventListener(
  "click",
  async function(){

    await signOut(auth);

  }
);


/* GET FORM */

function getFormData(){

  return {

    game:
      document.getElementById("game").value,

    title:
      document.getElementById("title").value.trim(),

    level:
      document.getElementById("level").value.trim(),

    region:
      document.getElementById("region").value.trim(),

    price:
      document.getElementById("price").value.trim(),

    status:
      document.getElementById("status").value,

    description:
      document.getElementById("description").value.trim()

  };

}


/* CLEAR FORM */

function clearForm(){

  document.getElementById("game").value =
    "Free Fire";

  document.getElementById("title").value =
    "";

  document.getElementById("level").value =
    "";

  document.getElementById("region").value =
    "";

  document.getElementById("price").value =
    "";

  document.getElementById("status").value =
    "AVAILABLE";

  document.getElementById("description").value =
    "";

  accountPhoto.value =
    "";

  selectedPhotoFile = null;

  selectedPhotoData = "";

  oldPhotoPath = "";

  photoPreview.src =
    "";

  photoPreview.style.display =
    "none";

  removePhotoBtn.style.display =
    "none";

  editingId =
    null;

  document.getElementById("formTitle").textContent =
    "ADD GAMING ACCOUNT";

  saveBtn.textContent =
    "ADD ACCOUNT";

  cancelEditBtn.classList.add(
    "hidden"
  );

}


/* UPLOAD PHOTO */

async function uploadAccountPhoto(
  file
){

  const user =
    auth.currentUser;

  if(!user){

    throw new Error(
      "You must be logged in."
    );

  }


  const safeName =
    file.name
      .replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


  const filePath =
    "accountPhotos/"
    + Date.now()
    + "_"
    + safeName;


  const storageRef =
    ref(
      storage,
      filePath
    );


  uploadingMessage.style.display =
    "block";

  uploadingMessage.textContent =
    "Uploading photo...";


  await uploadBytes(
    storageRef,
    file
  );


  const downloadURL =
    await getDownloadURL(
      storageRef
    );


  uploadingMessage.textContent =
    "Photo uploaded successfully.";


  return {

    url:downloadURL,

    path:filePath

  };

}


/* SAVE ACCOUNT */

saveBtn.addEventListener(
  "click",
  async function(){

    const user =
      auth.currentUser;


    if(!user){

      showMessage(
        formMessage,
        "You must be logged in as admin.",
        "error"
      );

      return;

    }


    const data =
      getFormData();


    if(
      !data.title ||
      !data.price
    ){

      showMessage(
        formMessage,
        "Account title and price are required.",
        "error"
      );

      return;

    }


    saveBtn.disabled =
      true;

    saveBtn.textContent =
      "SAVING...";


    try{

      let photoUrl =
        "";

      let photoPath =
        "";


      /*
      If a NEW photo was selected,
      upload it first.
      */

      if(selectedPhotoFile){

        const uploaded =
          await uploadAccountPhoto(
            selectedPhotoFile
          );

        photoUrl =
          uploaded.url;

        photoPath =
          uploaded.path;

      }


      /*
      ADD ACCOUNT
      */

      if(!editingId){

        await addDoc(
          collection(
            db,
            "accounts"
          ),
          {

            ...data,

            photoUrl:
              photoUrl,

            photoPath:
              photoPath,

            createdAt:
              serverTimestamp(),

            updatedAt:
              serverTimestamp(),

            createdBy:
              user.email

          }
        );


        showMessage(
          formMessage,
          "Account and photo added successfully.",
          "success"
        );

      }


      /*
      UPDATE ACCOUNT
      */

      else{

        const updateData = {

          ...data,

          updatedAt:
            serverTimestamp()

        };


        if(photoUrl){

          updateData.photoUrl =
            photoUrl;

          updateData.photoPath =
            photoPath;

        }


        await updateDoc(
          doc(
            db,
            "accounts",
            editingId
          ),
          updateData
        );


        /*
        Delete previous photo
        after new photo succeeds.
        */

        if(
          photoUrl &&
          oldPhotoPath &&
          oldPhotoPath !== photoPath
        ){

          try{

            await deleteObject(
              ref(
                storage,
                oldPhotoPath
              )
            );

          }catch(error){

            console.warn(
              "Old photo could not be deleted.",
              error
            );

          }

        }


        showMessage(
          formMessage,
          "Account updated successfully.",
          "success"
        );

      }


      clearForm();

      await loadAccounts();


    }catch(error){

      console.error(error);

      showMessage(
        formMessage,
        "Could not save. Make sure Firebase Storage is enabled and your Storage Rules allow the admin to upload.",
        "error"
      );

    }


    saveBtn.disabled =
      false;

    saveBtn.textContent =
      editingId
        ? "SAVE CHANGES"
        : "ADD ACCOUNT";

  }
);


/* LOAD ACCOUNTS */

async function loadAccounts(){

  accountsList.innerHTML =
    "<p style='color:#999'>Loading accounts...</p>";


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "accounts"
        )
      );


    if(snapshot.empty){

      accountsList.innerHTML =
        "<p style='color:#999'>No accounts yet.</p>";

      return;

    }


    accountsList.innerHTML =
      "";


    snapshot.forEach(
      function(item){

        const data =
          item.data();


        const account =
          document.createElement(
            "div"
          );


        account.className =
          "account";


        const photoHTML =
          data.photoUrl
            ?
              `
              <img
                class="account-photo"
                src="${escapeHtml(data.photoUrl)}"
                alt="${escapeHtml(data.title || "Gaming account")}"
              >
              `
            :
              "";


        account.innerHTML = `

          <div class="account-head">

            <h3>
              ${escapeHtml(
                data.title ||
                "Untitled Account"
              )}
            </h3>

            <span class="account-status">
              ${escapeHtml(
                data.status ||
                "AVAILABLE"
              )}
            </span>

          </div>

          ${photoHTML}

          <div class="account-meta">

            ${escapeHtml(
              data.game || ""
            )}

            · Level

            ${escapeHtml(
              data.level || "-"
            )}

            ·

            ${escapeHtml(
              data.region || "-"
            )}

          </div>

          <div class="account-description">

            ${escapeHtml(
              data.description || ""
            )}

          </div>

          <div class="account-price">

            ${escapeHtml(
              data.price || ""
            )}

          </div>

          <div class="account-actions">

            <button
              class="secondary"
              data-edit="${item.id}"
            >
              EDIT
            </button>

            <button
              class="danger"
              data-delete="${item.id}"
            >
              DELETE
            </button>

          </div>

        `;


        accountsList.appendChild(
          account
        );

      }
    );


    document
      .querySelectorAll(
        "[data-edit]"
      )
      .forEach(
        function(button){

          button.addEventListener(
            "click",
            function(){

              editAccount(
                button.dataset.edit,
                snapshot
              );

            }
          );

        }
      );


    document
      .querySelectorAll(
        "[data-delete]"
      )
      .forEach(
        function(button){

          button.addEventListener(
            "click",
            function(){

              deleteAccount(
                button.dataset.delete
              );

            }
          );

        }
      );


  }catch(error){

    console.error(error);

    accountsList.innerHTML = `

      <p style="color:#ff5555">

        Could not load accounts.
        Check Firebase Firestore
        and Security Rules.

      </p>

    `;

  }

}


/* EDIT ACCOUNT */

function editAccount(
  id,
  snapshot
){

  const item =
    snapshot.docs.find(
      function(docItem){

        return docItem.id === id;

      }
    );


  if(!item){
    return;
  }


  const data =
    item.data();


  document.getElementById("game").value =
    data.game || "Free Fire";

  document.getElementById("title").value =
    data.title || "";

  document.getElementById("level").value =
    data.level || "";

  document.getElementById("region").value =
    data.region || "";

  document.getElementById("price").value =
    data.price || "";

  document.getElementById("status").value =
    data.status || "AVAILABLE";

  document.getElementById("description").value =
    data.description || "";


  editingId =
    id;


  oldPhotoPath =
    data.photoPath || "";


  selectedPhotoFile =
    null;


  selectedPhotoData =
    "";


  accountPhoto.value =
    "";


  if(data.photoUrl){

    photoPreview.src =
      data.photoUrl;

    photoPreview.style.display =
      "block";

    removePhotoBtn.style.display =
      "block";

  }else{

    photoPreview.src =
      "";

    photoPreview.style.display =
      "none";

    removePhotoBtn.style.display =
      "none";

  }


  document.getElementById("formTitle").textContent =
    "EDIT GAMING ACCOUNT";

  saveBtn.textContent =
    "SAVE CHANGES";

  cancelEditBtn.classList.remove(
    "hidden"
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* CANCEL */

cancelEditBtn.addEventListener(
  "click",
  function(){

    clearForm();

  }
);


/* DELETE ACCOUNT */

async function deleteAccount(id){

  const confirmed =
    confirm(
      "Delete this gaming account?"
    );


  if(!confirmed){
    return;
  }


  try{

    const accountRef =
      doc(
        db,
        "accounts",
        id
      );


    const snapshot =
      await getDocs(
        collection(
          db,
          "accounts"
        )
      );


    const item =
      snapshot.docs.find(
        function(docItem){

          return docItem.id === id;

        }
      );


    if(item){

      const data =
        item.data();


      /*
      Delete photo from Storage
      if it exists.
      */

      if(data.photoPath){

        try{

          await deleteObject(
            ref(
              storage,
              data.photoPath
            )
          );

        }catch(error){

          console.warn(
            "Photo could not be deleted.",
            error
          );

        }

      }

    }


    await deleteDoc(
      accountRef
    );


    await loadAccounts();


    showMessage(
      formMessage,
      "Account deleted successfully.",
      "success"
    );


  }catch(error){

    console.error(error);

    showMessage(
      formMessage,
      "Could not delete account.",
      "error"
    );

  }

}


/* REFRESH */

refreshBtn.addEventListener(
  "click",
  loadAccounts
);


/* ESCAPE HTML */

function escapeHtml(value){

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>
