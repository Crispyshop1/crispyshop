<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRISPY SHOP — Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#050708;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

header{
  border-bottom:1px solid #00d9d0;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#050708;
}

.logo{
  width:140px;
  max-height:65px;
  object-fit:contain;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.admin-label{
  color:#00e5d5;
  font-size:13px;
  font-weight:bold;
}

button{
  cursor:pointer;
  font-weight:bold;
}

.logout{
  background:transparent;
  border:1px solid #ffd400;
  color:#ffd400;
  padding:10px 15px;
}

main{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:25px 15px 50px;
}

.login-box,
.admin-panel{
  width:100%;
  max-width:500px;
  margin:50px auto;
  background:#080d0f;
  border:1px solid #00d9d0;
  padding:25px;
}

.admin-panel{
  max-width:1100px;
  margin:0 auto;
}

h1{
  color:#ffd400;
  text-align:center;
  margin-bottom:8px;
}

.subtitle{
  color:#999;
  text-align:center;
  font-size:13px;
  margin-bottom:25px;
}

.logo-large{
  display:block;
  width:170px;
  max-height:100px;
  object-fit:contain;
  margin:0 auto 20px;
}

label{
  display:block;
  color:#00e5d5;
  font-size:13px;
  font-weight:bold;
  margin:15px 0 7px;
}

input,
select,
textarea{
  width:100%;
  background:#050708;
  border:1px solid #294448;
  color:#fff;
  padding:13px;
  outline:none;
  border-radius:3px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#00e5d5;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.primary{
  width:100%;
  margin-top:20px;
  padding:13px;
  background:#ffd400;
  color:#050708;
  border:1px solid #ffd400;
}

.secondary{
  padding:11px 16px;
  background:transparent;
  color:#00e5d5;
  border:1px solid #00d9d0;
}

.danger{
  padding:10px 14px;
  background:transparent;
  color:#ff5555;
  border:1px solid #ff5555;
}

.message{
  margin-top:15px;
  padding:12px;
  display:none;
  font-size:13px;
}

.success{
  display:block;
  color:#21d86b;
  border:1px solid #21d86b;
}

.error{
  display:block;
  color:#ff5555;
  border:1px solid #ff5555;
}

#adminArea{
  display:none;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.topbar h2{
  color:#ffd400;
}

.status{
  color:#00e5d5;
  font-size:13px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.full{
  grid-column:1/-1;
}

.form-box{
  border:1px solid #00aaa5;
  background:#070b0d;
  padding:20px;
  margin-bottom:25px;
}

.form-box h3{
  color:#00e5d5;
  margin-bottom:10px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.accounts{
  display:grid;
  gap:12px;
}

.account{
  border:1px solid #21494b;
  background:
    linear-gradient(
      rgba(0,217,208,.05) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(0,217,208,.05) 1px,
      transparent 1px
    ),
    #070b0d;
  background-size:25px 25px;
  padding:16px;
}

.account-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.account h3{
  color:#fff;
}

.account-meta{
  color:#00e5d5;
  font-size:13px;
  margin-top:8px;
}

.account-description{
  color:#999;
  font-size:13px;
  margin-top:8px;
}

.account-price{
  color:#ffd400;
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}

.account-status{
  display:inline-block;
  padding:5px 8px;
  background:#ffd400;
  color:#050708;
  font-size:10px;
  font-weight:bold;
}

.account-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.hidden{
  display:none!important;
}

@media(max-width:650px){

  header{
    flex-direction:column;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .account-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .admin-panel{
    padding:15px;
  }
}
</style>
</head>

<body>

<header>

  <img
    src="logo.png"
    class="logo"
    alt="CRISPY SHOP"
  >

  <div class="header-right">

    <span
      id="adminEmail"
      class="admin-label"
    ></span>

    <button
      id="logoutBtn"
      class="logout hidden"
    >
      LOG OUT
    </button>

  </div>

</header>


<main>


<!-- LOGIN -->

<section
  id="loginArea"
  class="login-box"
>

  <img
    src="logo.png"
    class="logo-large"
    alt="CRISPY SHOP"
  >

  <h1>ADMIN PANEL</h1>

  <p class="subtitle">
    Authorized administrators only
  </p>

  <label for="email">
    ADMIN EMAIL
  </label>

  <input
    id="email"
    type="email"
    placeholder="Admin email"
    autocomplete="username"
  >

  <label for="password">
    PASSWORD
  </label>

  <input
    id="password"
    type="password"
    placeholder="Admin password"
    autocomplete="current-password"
  >

  <button
    id="loginBtn"
    class="primary"
  >
    SECURE LOGIN
  </button>

  <div
    id="loginMessage"
    class="message"
  ></div>

</section>


<!-- ADMIN AREA -->

<section
  id="adminArea"
  class="admin-panel"
>

  <div class="topbar">

    <div>
      <h2>⚙ CRISPY SHOP ADMIN</h2>

      <div class="status">
        ● SECURE ADMIN SESSION
      </div>
    </div>

  </div>


  <!-- ADD / EDIT -->

  <div class="form-box">

    <h3 id="formTitle">
      ADD GAMING ACCOUNT
    </h3>

    <div class="form-grid">

      <div>
        <label for="game">
          GAME
        </label>

        <select id="game">
          <option value="Free Fire">
            Free Fire
          </option>

          <option value="eFootball">
            eFootball
          </option>

          <option value="COD Mobile">
            COD Mobile
          </option>

          <option value="DLS">
            DLS
          </option>

          <option value="PUBG">
            PUBG
          </option>

          <option value="Roblox">
            Roblox
          </option>

          <option value="Other">
            Other
          </option>
        </select>
      </div>


      <div>
        <label for="title">
          ACCOUNT TITLE
        </label>

        <input
          id="title"
          type="text"
          placeholder="Royal Vault 09"
        >
      </div>


      <div>
        <label for="level">
          LEVEL
        </label>

        <input
          id="level"
          type="number"
          placeholder="86"
        >
      </div>


      <div>
        <label for="region">
          REGION
        </label>

        <input
          id="region"
          type="text"
          placeholder="SEA"
        >
      </div>


      <div>
        <label for="price">
          PRICE
        </label>

        <input
          id="price"
          type="text"
          placeholder="₦425,000"
        >
      </div>


      <div>
        <label for="status">
          STATUS
        </label>

        <select id="status">
          <option value="AVAILABLE">
            AVAILABLE
          </option>

          <option value="SOLD">
            SOLD
          </option>

          <option value="RESERVED">
            RESERVED
          </option>
        </select>
      </div>


      <div class="full">

        <label for="description">
          DESCRIPTION
        </label>

        <textarea
          id="description"
          placeholder="12 Evo Weapons, Booyah Pass archive"
        ></textarea>

      </div>

    </div>


    <div class="actions">

      <button
        id="saveBtn"
        class="primary"
        style="width:auto;margin-top:0"
      >
        ADD ACCOUNT
      </button>

      <button
        id="cancelEditBtn"
        class="secondary hidden"
      >
        CANCEL EDIT
      </button>

    </div>


    <div
      id="formMessage"
      class="message"
    ></div>

  </div>


  <!-- ACCOUNTS -->

  <div class="topbar">

    <h2>
      SHOP ACCOUNTS
    </h2>

    <button
      id="refreshBtn"
      class="secondary"
    >
      ↻ REFRESH
    </button>

  </div>


  <div
    id="accountsList"
    class="accounts"
  >

    <p style="color:#999">
      Loading accounts...
    </p>

  </div>

</section>

</main>


<!-- FIREBASE -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/*
====================================================
PASTE YOUR EXISTING FIREBASE CONFIG HERE
====================================================

Use the SAME firebaseConfig from your index.html.

Do NOT put a Firebase service-account private key here.
====================================================
*/

const firebaseConfig = {

  apiKey: "PASTE_YOUR_API_KEY",

  authDomain: "PASTE_YOUR_AUTH_DOMAIN",

  projectId: "PASTE_YOUR_PROJECT_ID",

  storageBucket: "PASTE_YOUR_STORAGE_BUCKET",

  messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",

  appId: "PASTE_YOUR_APP_ID"

};


/*
====================================================
ADMIN EMAIL
====================================================

Put the email address that is allowed to use
this admin panel.

This is only an extra client-side check.
Firestore Security Rules MUST also protect
the accounts collection.
====================================================
*/

const ADMIN_EMAIL =
  "YOUR_ADMIN_EMAIL_HERE";


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


const loginArea =
  document.getElementById("loginArea");

const adminArea =
  document.getElementById("adminArea");

const loginBtn =
  document.getElementById("loginBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const loginMessage =
  document.getElementById("loginMessage");

const formMessage =
  document.getElementById("formMessage");

const adminEmail =
  document.getElementById("adminEmail");

const accountsList =
  document.getElementById("accountsList");

const saveBtn =
  document.getElementById("saveBtn");

const cancelEditBtn =
  document.getElementById("cancelEditBtn");

const refreshBtn =
  document.getElementById("refreshBtn");


let editingId = null;


/*
====================================================
MESSAGE
====================================================
*/

function showMessage(
  element,
  text,
  type
){

  element.textContent = text;

  element.className =
    "message " + type;

}


/*
====================================================
LOGIN
====================================================
*/

loginBtn.addEventListener(
  "click",
  async () => {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if(!email || !password){

      showMessage(
        loginMessage,
        "Enter your admin email and password.",
        "error"
      );

      return;
    }

    loginBtn.disabled = true;

    loginBtn.textContent =
      "LOGGING IN...";

    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }catch(error){

      console.error(error);

      showMessage(
        loginMessage,
        "Login failed. Check your email and password.",
        "error"
      );

      loginBtn.disabled = false;

      loginBtn.textContent =
        "SECURE LOGIN";
    }

  }
);


/*
====================================================
AUTH STATE
====================================================
*/

onAuthStateChanged(
  auth,
  async (user) => {

    if(!user){

      loginArea.style.display =
        "block";

      adminArea.style.display =
        "none";

      logoutBtn.classList.add(
        "hidden"
      );

      adminEmail.textContent = "";

      return;
    }


    /*
    Extra admin email check.
    */

    if(
      ADMIN_EMAIL !==
      "YOUR_ADMIN_EMAIL_HERE" &&
      user.email !== ADMIN_EMAIL
    ){

      await signOut(auth);

      showMessage(
        loginMessage,
        "This account is not authorized to access the admin panel.",
        "error"
      );

      return;
    }


    loginArea.style.display =
      "none";

    adminArea.style.display =
      "block";

    logoutBtn.classList.remove(
      "hidden"
    );

    adminEmail.textContent =
      user.email || "";

    await loadAccounts();

  }
);


/*
====================================================
LOGOUT
====================================================
*/

logoutBtn.addEventListener(
  "click",
  async () => {

    await signOut(auth);

  }
);


/*
====================================================
GET FORM DATA
====================================================
*/

function getFormData(){

  return {

    game:
      document.getElementById("game").value,

    title:
      document.getElementById("title").value.trim(),

    level:
      document.getElementById("level").value.trim(),

    region:
      document.getElementById("region").value.trim(),

    price:
      document.getElementById("price").value.trim(),

    status:
      document.getElementById("status").value,

    description:
      document.getElementById("description").value.trim()

  };

}


/*
====================================================
CLEAR FORM
====================================================
*/

function clearForm(){

  document.getElementById("game").value =
    "Free Fire";

  document.getElementById("title").value =
    "";

  document.getElementById("level").value =
    "";

  document.getElementById("region").value =
    "";

  document.getElementById("price").value =
    "";

  document.getElementById("status").value =
    "AVAILABLE";

  document.getElementById("description").value =
    "";

  editingId = null;

  document.getElementById("formTitle").textContent =
    "ADD GAMING ACCOUNT";

  saveBtn.textContent =
    "ADD ACCOUNT";

  cancelEditBtn.classList.add(
    "hidden"
  );

}


/*
====================================================
ADD / UPDATE ACCOUNT
====================================================
*/

saveBtn.addEventListener(
  "click",
  async () => {

    const user =
      auth.currentUser;

    if(!user){

      showMessage(
        formMessage,
        "You must be logged in as admin.",
        "error"
      );

      return;
    }


    const data =
      getFormData();


    if(
      !data.title ||
      !data.price
    ){

      showMessage(
        formMessage,
        "Account title and price are required.",
        "error"
      );

      return;
    }


    saveBtn.disabled = true;

    try{

      if(editingId){

        await updateDoc(
          doc(
            db,
            "accounts",
            editingId
          ),
          {
            ...data,
            updatedAt:
              serverTimestamp()
          }
        );

        showMessage(
          formMessage,
          "Account updated successfully.",
          "success"
        );

      }else{

        await addDoc(
          collection(
            db,
            "accounts"
          ),
          {
            ...data,
            createdAt:
              serverTimestamp(),
            updatedAt:
              serverTimestamp()
          }
        );

        showMessage(
          formMessage,
          "Account added successfully.",
          "success"
        );

      }


      clearForm();

      await loadAccounts();

    }catch(error){

      console.error(error);

      showMessage(
        formMessage,
        "Could not save the account. Check your Firebase Security Rules.",
        "error"
      );

    }


    saveBtn.disabled = false;

  }
);


/*
====================================================
LOAD ACCOUNTS
====================================================
*/

async function loadAccounts(){

  accountsList.innerHTML =
    "<p style='color:#999'>Loading accounts...</p>";

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "accounts"
        )
      );


    if(snapshot.empty){

      accountsList.innerHTML =
        "<p style='color:#999'>No accounts yet.</p>";

      return;
    }


    accountsList.innerHTML = "";


    snapshot.forEach(
      (item) => {

        const data =
          item.data();

        const account =
          document.createElement(
            "div"
          );

        account.className =
          "account";


        account.innerHTML = `

          <div class="account-head">

            <h3>
              ${escapeHtml(
                data.title || "Untitled Account"
              )}
            </h3>

            <span class="account-status">
              ${escapeHtml(
                data.status || "AVAILABLE"
              )}
            </span>

          </div>


          <div class="account-meta">

            ${escapeHtml(
              data.game || ""
            )}

            · Level

            ${escapeHtml(
              data.level || "-"
            )}

            ·

            ${escapeHtml(
              data.region || "-"
            )}

          </div>


          <div class="account-description">

            ${escapeHtml(
              data.description || ""
            )}

          </div>


          <div class="account-price">

            ${escapeHtml(
              data.price || ""
            )}

          </div>


          <div class="account-actions">

            <button
              class="secondary"
              data-edit="${item.id}"
            >
              EDIT
            </button>

            <button
              class="danger"
              data-delete="${item.id}"
            >
              DELETE
            </button>

          </div>

        `;


        accountsList.appendChild(
          account
        );

      }
    );


    /*
    EDIT buttons
    */

    document
      .querySelectorAll(
        "[data-edit]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              editAccount(
                button.dataset.edit,
                snapshot
              );

            }
          );

        }
      );


    /*
    DELETE buttons
    */

    document
      .querySelectorAll(
        "[data-delete]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              deleteAccount(
                button.dataset.delete
              );

            }
          );

        }
      );


  }catch(error){

    console.error(error);

    accountsList.innerHTML = `

      <p style="color:#ff5555">

        Could not load accounts.
        Check Firebase configuration
        and Firestore Security Rules.

      </p>

    `;

  }

}


/*
====================================================
EDIT ACCOUNT
====================================================
*/

function editAccount(
  id,
  snapshot
){

  const item =
    snapshot.docs.find(
      docItem =>
        docItem.id === id
    );


  if(!item) return;


  const data =
    item.data();


  document.getElementById("game").value =
    data.game || "Free Fire";

  document.getElementById("title").value =
    data.title || "";

  document.getElementById("level").value =
    data.level || "";

  document.getElementById("region").value =
    data.region || "";

  document.getElementById("price").value =
    data.price || "";

  document.getElementById("status").value =
    data.status || "AVAILABLE";

  document.getElementById("description").value =
    data.description || "";


  editingId =
    id;


  document.getElementById("formTitle").textContent =
    "EDIT GAMING ACCOUNT";

  saveBtn.textContent =
    "SAVE CHANGES";

  cancelEditBtn.classList.remove(
    "hidden"
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/*
====================================================
CANCEL EDIT
====================================================
*/

cancelEditBtn.addEventListener(
  "click",
  () => {

    clearForm();

  }
);


/*
====================================================
DELETE ACCOUNT
====================================================
*/

async function deleteAccount(id){

  const confirmed =
    confirm(
      "Delete this gaming account?"
    );

  if(!confirmed) return;


  try{

    await deleteDoc(
      doc(
        db,
        "accounts",
        id
      )
    );


    await loadAccounts();


  }catch(error){

    console.error(error);

    alert(
      "Could not delete account. Check your Firebase Security Rules."
    );

  }

}


/*
====================================================
REFRESH
====================================================
*/

refreshBtn.addEventListener(
  "click",
  loadAccounts
);


/*
====================================================
SAFE TEXT
====================================================
*/

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
