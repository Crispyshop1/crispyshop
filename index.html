<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crispyshop</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #1c1c1c;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      color: #aaa;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 25px;
    }

    .product {
      background: #1d1d1d;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 10px;
    }

    .available {
      color: #00ff88;
    }

    .sold {
      color: #ff4444;
    }

    button {
      background: #00c853;
      border: none;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛒 Crispyshop</h1>
    <p>Gaming accounts & items</p>
  </header>

  <section class="products">

    <div class="product">
      <img src="https://via.placeholder.com/400x250" alt="Product">
      <h2>eFootball Account</h2>
      <p class="price">₦50,000</p>
      <p class="available">● AVAILABLE</p>
      <button>Buy Now</button>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/400x250" alt="Product">
      <h2>Free Fire Account</h2>
      <p class="price">₦30,000</p>
      <p class="sold">● SOLD</p>
      <button>Sold Out</button>
    </div>

  </section>

</body>
</html>
