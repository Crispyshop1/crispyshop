<script>
  const ADMIN_PASSWORD = "1234";

  function showGame(game, button) {
    document.querySelectorAll(".game-section").forEach(section => {
      section.classList.remove("active");
    });

    document.getElementById(game).classList.add("active");

    document.querySelectorAll(".tab").forEach(tab => {
      tab.classList.remove("active");
    });

    button.classList.add("active");
  }

  function openAdmin() {
    document.getElementById("adminModal").classList.add("show");
  }

  function closeAdmin() {
    document.getElementById("adminModal").classList.remove("show");
  }

  function addAccount() {
    const password = document.getElementById("adminPassword").value;
    const game = document.getElementById("game").value;
    const name = document.getElementById("accountName").value.trim();
    const price = document.getElementById("accountPrice").value;
    const imageFile = document.getElementById("accountImage").files[0];

    if (password !== ADMIN_PASSWORD) {
      alert("Wrong admin password.");
      return;
    }

    if (!name || !price || !imageFile) {
      alert("Please fill in all account details.");
      return;
    }

    const reader = new FileReader();

    reader.onload = function (e) {
      const image = e.target.result;

      const product = document.createElement("div");
      product.className = "product";

      product.innerHTML = `
        <img src="${image}" alt="${name}">

        <h3>${name}</h3>

        <p class="price">
          ₦${Number(price).toLocaleString()}
        </p>

        <p class="available">
          ● AVAILABLE
        </p>

        <a
          href="https://wa.me/2347051885555?text=${encodeURIComponent(
            "Hello Crispy, I would like to purchase your " + name + " account."
          )}"
          target="_blank"
        >
          <button class="whatsapp-btn">
            💬 Buy on WhatsApp
          </button>
        </a>
      `;

      const container = document.getElementById(game + "Products");

      const emptyMessage = container.querySelector(".empty-message");

      if (emptyMessage) {
        emptyMessage.remove();
      }

      container.appendChild(product);

      document.getElementById("accountName").value = "";
      document.getElementById("accountPrice").value = "";
      document.getElementById("accountImage").value = "";
      document.getElementById("adminPassword").value = "";

      alert("Account added successfully!");
    };

    reader.readAsDataURL(imageFile);
  }
</script>
