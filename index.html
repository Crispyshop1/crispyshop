<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crispyshop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    header {
      background: #181818;
      padding: 30px 20px;
      text-align: center;
      border-bottom: 1px solid #292929;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header p {
      color: #aaa;
      margin-top: 8px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      padding: 30px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .product {
      background: #1b1b1b;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 15px;
      text-align: center;
      overflow: hidden;
    }

    .product img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 12px;
      background: #252525;
    }

    .product h2 {
      margin: 15px 0 8px;
      font-size: 21px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin: 8px 0;
    }

    .available {
      color: #00e676;
      font-weight: bold;
    }

    button {
      width: 100%;
      background: #00c853;
      border: none;
      color: white;
      padding: 13px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #00a844;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛒 Crispyshop</h1>
    <p>Gaming Accounts & Items</p>
  </header>

  <section class="products">

    <div class="product">
     <img
  src="photo_2026-08-19_23-05-25.jpg"
  alt="eFootball Account"
>

      <h2>eFootball Account</h2>

      <p class="price">₦20,000</p>

      <p class="available">● AVAILABLE</p>

      <button>Buy Now</button>
    </div>

  </section>

  <footer>
    © 2026 Crispyshop
  </footer>

</body>
</html>
